# KAAL Discord C2 Profile Configuration
# Matches Mythic's checks
discord:
  bot_token: "YOUR_DISCORD_BOT_TOKEN_HERE"
  channel_id: "1471272917403697248"
  use_gateway: false
  poll_interval: 4

kaal_server:
  host: "localhost"
  port: 5000
  api_path: "/api/v1/agent_message"
  use_https: false

rate_limiting:
  max_requests_per_second: 50
  burst_multiplier: 2
  backoff_factor: 2

logging:
  level: "INFO"
